<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <!-- S7 BIOGLOW background: glowing mycelium threads growing in from the corners, centre left clear for content. Static on purpose (cheap to draw). -->
  <defs>
    <linearGradient id="fadeL" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#4dff9e" stop-opacity=".55"/><stop offset="1" stop-color="#4dff9e" stop-opacity="0"/></linearGradient>
    <linearGradient id="fadeR" x1="1" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2fe3c6" stop-opacity=".5"/><stop offset="1" stop-color="#2fe3c6" stop-opacity="0"/></linearGradient>
    <linearGradient id="fadeB" x1="1" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#b8ff5e" stop-opacity=".45"/><stop offset="1" stop-color="#b8ff5e" stop-opacity="0"/></linearGradient>
    <radialGradient id="node"><stop offset="0" stop-color="#d9ffe9"/><stop offset=".25" stop-color="#4dff9e" stop-opacity=".85"/><stop offset="1" stop-color="#4dff9e" stop-opacity="0"/></radialGradient>
    <radialGradient id="nodeT"><stop offset="0" stop-color="#dcfffa"/><stop offset=".25" stop-color="#2fe3c6" stop-opacity=".85"/><stop offset="1" stop-color="#2fe3c6" stop-opacity="0"/></radialGradient>
    <radialGradient id="nodeL"><stop offset="0" stop-color="#f3ffe0"/><stop offset=".25" stop-color="#b8ff5e" stop-opacity=".85"/><stop offset="1" stop-color="#b8ff5e" stop-opacity="0"/></radialGradient>
    <radialGradient id="nodeV"><stop offset="0" stop-color="#f1e9ff"/><stop offset=".25" stop-color="#a98bff" stop-opacity=".8"/><stop offset="1" stop-color="#a98bff" stop-opacity="0"/></radialGradient>
  </defs>

  <!-- bottom-left colony -->
  <g fill="none" stroke="url(#fadeL)" stroke-linecap="round">
    <path d="M-20 900C90 860 160 800 250 760S410 690 470 600" stroke-width="2.2"/>
    <path d="M250 760C300 800 360 830 450 840S560 880 620 940" stroke-width="1.4"/>
    <path d="M330 720C330 660 300 600 320 540S380 450 370 380" stroke-width="1.3"/>
    <path d="M470 600C520 590 560 560 610 570S690 610 740 600" stroke-width="1"/>
    <path d="M120 830C130 780 110 730 140 690S200 640 190 590" stroke-width="1.1"/>
    <path d="M450 840C480 800 520 790 560 760" stroke-width=".8"/>
    <path d="M320 540C280 520 250 480 210 470" stroke-width=".8"/>
    <path d="M-20 1000C60 960 120 950 200 970S330 1000 380 1010" stroke-width="1.2"/>
  </g>

  <!-- top-right colony -->
  <g fill="none" stroke="url(#fadeR)" stroke-linecap="round">
    <path d="M1620 90C1510 120 1440 180 1350 220S1190 290 1130 380" stroke-width="2.2"/>
    <path d="M1350 220C1300 180 1240 150 1150 140S1040 100 980 50" stroke-width="1.4"/>
    <path d="M1270 260C1270 320 1300 380 1280 440S1220 530 1230 600" stroke-width="1.2"/>
    <path d="M1130 380C1080 390 1040 420 990 410S910 370 860 380" stroke-width="1"/>
    <path d="M1480 150C1470 200 1490 250 1460 290S1400 340 1410 390" stroke-width="1.1"/>
    <path d="M1150 140C1120 180 1080 190 1040 220" stroke-width=".8"/>
    <path d="M1620 -20C1540 20 1480 30 1400 10" stroke-width="1.2"/>
  </g>

  <!-- bottom-right lime runners -->
  <g fill="none" stroke="url(#fadeB)" stroke-linecap="round">
    <path d="M1620 940C1530 900 1460 900 1390 850S1290 760 1220 750" stroke-width="1.6"/>
    <path d="M1390 850C1380 800 1400 760 1370 720" stroke-width="1"/>
    <path d="M1500 905C1480 960 1440 980 1400 1010" stroke-width="1"/>
  </g>

  <!-- top-left faint wisps -->
  <g fill="none" stroke="url(#fadeL)" stroke-linecap="round" opacity=".7">
    <path d="M-20 160C60 170 120 210 180 200S270 150 320 170" stroke-width="1.2"/>
    <path d="M120 195C130 240 110 280 130 320" stroke-width=".8"/>
  </g>

  <!-- glowing nodes -->
  <g>
    <circle cx="250" cy="760" r="16" fill="url(#node)"/>
    <circle cx="470" cy="600" r="14" fill="url(#node)"/>
    <circle cx="370" cy="380" r="11" fill="url(#node)"/>
    <circle cx="190" cy="590" r="10" fill="url(#nodeL)"/>
    <circle cx="740" cy="600" r="9" fill="url(#node)"/>
    <circle cx="620" cy="940" r="11" fill="url(#nodeV)"/>
    <circle cx="210" cy="470" r="7" fill="url(#nodeV)"/>
    <circle cx="560" cy="760" r="8" fill="url(#nodeL)"/>
    <circle cx="1350" cy="220" r="16" fill="url(#nodeT)"/>
    <circle cx="1130" cy="380" r="14" fill="url(#nodeT)"/>
    <circle cx="1230" cy="600" r="11" fill="url(#nodeT)"/>
    <circle cx="980" cy="50" r="10" fill="url(#nodeV)"/>
    <circle cx="860" cy="380" r="9" fill="url(#nodeT)"/>
    <circle cx="1410" cy="390" r="9" fill="url(#nodeL)"/>
    <circle cx="1040" cy="220" r="7" fill="url(#nodeV)"/>
    <circle cx="1220" cy="750" r="12" fill="url(#nodeL)"/>
    <circle cx="1370" cy="720" r="8" fill="url(#nodeL)"/>
    <circle cx="320" cy="170" r="9" fill="url(#node)"/>
    <circle cx="130" cy="320" r="6" fill="url(#nodeT)"/>
  </g>
</svg>
