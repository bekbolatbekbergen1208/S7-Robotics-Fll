<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>3D-симулятор BIOGLOW — S7 Robotics</title>
  <meta name="theme-color" content="#03110c" />
  <link rel="icon" type="image/png" href="./theme/s7-icon.png" />
  <script src="./theme/theme.js"></script>
  <script src="./theme/isolation.js"></script>
  <script src="./theme/mobile.js" defer></script>
  
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <img src="./theme/s7-logo.png" alt="S7 Robotics" />
      <div>
        <div class="brand-title">S7 ROBOTICS · FLL</div>
        <div class="brand-sub">3D-симулятор BIOGLOW</div>
      </div>
    </div>
    <nav class="tabs">
      <button class="tab active" data-tab="sim"><svg class="re-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><path d="M4 22v-7"/></svg> Поле и код</button>
      <button class="tab" data-tab="builder"><svg class="re-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94z"/></svg> Конструктор робота</button>
      <button class="tab" data-tab="help"><svg class="re-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg> Справка</button>
    </nav>
    <div class="match-box">
      <div class="timer" id="timer" title="Время матча">2:30</div>
      <div class="tokens" id="tokens" title="Жетоны точности"></div>
      <div class="score-big" title="Очки (как на официальном протоколе)"><span id="scoreTotal">0</span><small>/530</small></div>
    </div>
  </header>

  <main>
    <!-- ================= SIMULATOR ================= -->
    <section id="tab-sim" class="tab-page active">
      <aside class="code-panel" id="codePanel">
        <div class="panel-head">
          <select id="programSelect" title="Программы (запуски)"></select>
          <button class="icon-btn" id="btnNewProg" title="Новая программа">＋</button>
          <button class="icon-btn" id="btnRenameProg" title="Переименовать"><svg class="re-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/></svg></button>
          <button class="icon-btn" id="btnDelProg" title="Удалить"><svg class="re-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg></button>
          <select id="exampleSelect" title="Примеры программ"><option value="">Примеры…</option></select>
        </div>
        <div class="editor" id="editor"></div>
        <div class="run-bar" id="runBar">
          <button class="btn run" id="btnRun" title="Запустить программу (Ctrl+Enter)"><svg class="re-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3l14 9-14 9z"/></svg> Запуск</button>
          <button class="btn stop" id="btnStop" title="Остановить программу на месте (без штрафа)"><svg class="re-ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="5" width="14" height="14" rx="2"/></svg> Стоп</button>
          <button class="btn warn" id="btnInterrupt" title="Взять робота руками и вернуть на базу (вне базы: −1 жетон)"><svg class="re-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 11V6a2 2 0 0 0-4 0v5"/><path d="M14 10V4a2 2 0 0 0-4 0v6"/><path d="M10 10.5V6a2 2 0 0 0-4 0v8"/><path d="M18 8a2 2 0 1 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.86-6-2.34l-3.6-3.6a2 2 0 0 1 2.83-2.82L7 15"/></svg> Прервать</button>
          <span class="py-state" id="pyState"></span>
        </div>
        <div class="console" id="console"></div>
      </aside>

      <div class="field-wrap">
        <div class="field-toolbar">
          <div class="group">
            <button class="btn small toggle on" id="btnToggleCode" title="Показать / скрыть поле для кода"><svg class="re-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="m16 18 6-6-6-6"/><path d="m8 6-6 6 6 6"/></svg> Код</button>
            <button class="btn small toggle on" id="btnToggleScore" title="Показать / скрыть протокол очков"><svg class="re-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3v18h18"/><path d="M18 17V9"/><path d="M13 17V5"/><path d="M8 17v-3"/></svg> Протокол</button>
            <button class="btn small toggle" id="btnAtt" title="Насадки: надеть на робота одним кликом"><svg class="re-ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/></svg> Насадки</button>
          </div>
          <div class="group" id="runSlot"></div>
          <div class="group">
            <div class="seg mode" id="modeSeg" title="Режим">
              <button data-mode="free" class="on" title="Без таймера и штрафов"><svg class="re-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="m6.5 6.5 11 11"/><path d="m21 21-1-1"/><path d="m3 3 1 1"/><path d="m18 22 4-4"/><path d="m2 6 4-4"/><path d="m3 10 7-7"/><path d="m14 21 7-7"/></svg> Тренировка</button><button data-mode="match" title="Настоящий матч: таймер 2:30, жетоны, итог"><svg class="re-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><path d="M4 22v-7"/></svg> Матч 2:30</button>
            </div>
            <button class="btn small primary" id="btnTimer" title="Запустить таймер 2:30 (или он стартует сам с первым запуском)"><svg class="re-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M10 2h4"/><path d="m12 14 3-3"/><circle cx="12" cy="14" r="8"/></svg> Старт 2:30</button>
            <button class="btn small" id="btnMatch" title="Начать матч заново: поле, таймер и жетоны сбрасываются"><svg class="re-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/></svg> Новый матч</button>
            <select id="matchSide" title="Зона запуска"><option value="left">Левая база</option><option value="right">Правая база</option></select>
            <button class="btn small" id="btnReset" title="Вернуть все модели в исходное положение"><svg class="re-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg> Сброс поля</button>
            <button class="btn small" id="btnToStart" title="Поставить робота в стартовую позицию базы (между запусками, пока робот на базе)"><svg class="re-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/></svg> На старт</button>
          </div>
          <div class="group">
            <span class="lbl">Скорость</span>
            <div class="seg" id="speedSeg">
              <button data-speed="0.25">¼×</button><button data-speed="0.5">½×</button><button data-speed="1" class="on">1×</button><button data-speed="2">2×</button><button data-speed="4">4×</button>
            </div>
            <button class="btn small" id="btnPause" title="Пауза"><svg class="re-ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></svg></button>
          </div>
          <div class="group">
            <span class="lbl">Камера</span>
            <div class="seg" id="viewSeg">
              <button data-view="3d" class="on">3D</button><button data-view="top">Сверху</button><button data-view="home">База</button><button data-view="follow">За роботом</button>
            </div>
          </div>
        </div>
        <div class="field" id="field">
          <div class="hud">
            <div class="hud-card" id="hudMatch"></div>
            <div class="hud-card" id="hudRobot"></div>
          </div>
          <div class="hub-display" id="hubDisplay" title="Экран хаба"></div>
          <div class="results" id="results"></div>
          <div class="att-panel" id="attPanel"></div>
          <div class="hint" id="fieldHint">Перетащите робота мышью (колесо — поворот). Ручное управление: щёлкните по полю, затем <b>WASD/стрелки</b> — езда, <b>R/F</b> — рука C, <b>T/G</b> — мотор D, <b>Shift</b> — медленно.</div>
          <div class="loading" id="loading"><div class="spinner"></div><div id="loadingText">Загрузка физики…</div></div>
        </div>
      </div>

      <aside class="score-panel" id="scorePanel">
        <div class="panel-head">
          <b>Протокол очков</b>
          <span class="muted" id="scoreMode">в реальном времени</span>
        </div>
        <div class="setup" id="setupBox"></div>
        <div class="sheet" id="sheet"></div>
      </aside>
    </section>

    <!-- ================= BUILDER ================= -->
    <section id="tab-builder" class="tab-page">
      <aside class="palette" id="palette"></aside>
      <div class="builder-view" id="builderView">
        <div class="builder-hint" id="builderHint"></div>
      </div>
      <aside class="props" id="props"></aside>
    </section>

    <!-- ================= HELP ================= -->
    <section id="tab-help" class="tab-page">
      <div class="help" id="help"></div>
    </section>
  </main>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
